# Code Council PR Review
# Multi-model AI code review for pull requests

name: Code Council Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Prevent concurrent reviews on the same PR
concurrency:
  group: code-council-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and build
        run: |
          bun install
          bun run build

      - name: Run Code Council Review
        id: review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Run review with pr-comments format for inline comments
          # Note: stdout goes to file, stderr shows logs in console
          if node dist/index.js review git --review-type diff --format pr-comments \
            --models "google/gemini-3-pro-preview,openai/gpt-5.2-codex,minimax/minimax-m2.1,z-ai/glm-4.7,moonshotai/kimi-k2.5,deepseek/deepseek-v3.2" > review.json; then
            echo "format=pr-comments" >> $GITHUB_OUTPUT
            echo "has_review=true" >> $GITHUB_OUTPUT
          else
            echo "pr-comments format failed, falling back to markdown"
            cat review.json || true
            if node dist/index.js review git --review-type diff --format markdown > review.md; then
              echo "format=markdown" >> $GITHUB_OUTPUT
              echo "has_review=true" >> $GITHUB_OUTPUT
            else
              echo "Review failed"
              cat review.md || true
              echo "has_review=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Clean Previous Code Council Reviews
        if: steps.review.outputs.has_review == 'true' && steps.review.outputs.format == 'pr-comments'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Dismiss any pending reviews from this bot to avoid "only one pending review" error
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --jq '.[] | select(.state == "PENDING") | .id' | \
          while read REVIEW_ID; do
            echo "Dismissing pending review $REVIEW_ID"
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/$REVIEW_ID \
              --method DELETE 2>/dev/null || true
          done

          # Delete previous Code Council review comments (identified by severity tags)
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
            --jq '.[] | select(.body | contains("Code Council") or contains("[CRITICAL]") or contains("[HIGH]") or contains("[MEDIUM]")) | .id' | \
          while read COMMENT_ID; do
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/$COMMENT_ID \
              --method DELETE 2>/dev/null || true
          done

      - name: Post Inline Review
        if: steps.review.outputs.has_review == 'true' && steps.review.outputs.format == 'pr-comments'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Debug: show review.json content
          echo "=== review.json content ==="
          cat review.json
          echo ""
          echo "=== validating JSON ==="
          if ! jq . review.json > /dev/null 2>&1; then
            echo "Invalid JSON in review.json"
            exit 1
          fi

          echo "JSON is valid"

          # Try batch review first
          if gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
              --method POST \
              --input review.json 2>/dev/null; then
            echo "Batch review posted successfully"
          else
            echo "Batch review failed, falling back to individual comments"

            # Post summary body as a standalone review
            SUMMARY_BODY=$(jq -r '.body' review.json)
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
              --method POST \
              -f body="$SUMMARY_BODY" \
              -f event="COMMENT" || echo "Failed to post summary review"

            # Post individual inline comments
            COMMENT_COUNT=$(jq '.comments | length' review.json)
            echo "Posting $COMMENT_COUNT individual comments..."

            SUCCESS_COUNT=0
            FAIL_COUNT=0

            for i in $(seq 0 $((COMMENT_COUNT - 1))); do
              PATH_VAL=$(jq -r ".comments[$i].path" review.json)
              LINE_VAL=$(jq -r ".comments[$i].line" review.json)
              BODY_VAL=$(jq -r ".comments[$i].body" review.json)

              # Use the single-comment endpoint
              if gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
                  --method POST \
                  -f path="$PATH_VAL" \
                  -F line="$LINE_VAL" \
                  -f body="$BODY_VAL" \
                  -f commit_id="${{ github.event.pull_request.head.sha }}" 2>/dev/null; then
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              else
                FAIL_COUNT=$((FAIL_COUNT + 1))
                echo "Failed to post comment on $PATH_VAL:$LINE_VAL"
              fi
            done

            echo "Individual comments: $SUCCESS_COUNT succeeded, $FAIL_COUNT failed"
          fi

      - name: Post Markdown Review (Fallback)
        if: steps.review.outputs.has_review == 'true' && steps.review.outputs.format == 'markdown'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read review content
          REVIEW_BODY=$(cat review.md)

          # Add header and footer
          FULL_REVIEW="## Code Council Multi-Model Review

          $REVIEW_BODY

          ---
          *Reviewed by [Code Council](https://github.com/klitchevo/code-council) using multiple AI models*"

          # Post as a PR review (not just a comment)
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --method POST \
            -f body="$FULL_REVIEW" \
            -f event="COMMENT"
