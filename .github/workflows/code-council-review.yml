# Code Council PR Review
# This workflow runs multi-model AI code reviews on pull requests
# Copy this file to your repository's .github/workflows/ directory

name: Code Council Review

on:
  pull_request:
    types: [opened, synchronize]

# Prevent multiple concurrent reviews on the same PR
concurrency:
  group: code-council-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Code Council Review
        id: review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          npx @klitchevo/code-council review git \
            --review-type diff \
            --models "minimax/minimax-m2.1,z-ai/glm-4.7,moonshotai/kimi-k2.5,deepseek/deepseek-v3.2,google/gemini-3-pro-preview,openai/gpt-5.2" \
            --format markdown \
            > review.md

      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.md', 'utf8');

            // Marker for finding/updating our comment
            const marker = '<!-- code-council-review -->';

            // Find existing comment to update (sticky comment pattern)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body.includes(marker));
            const body = `${marker}\n## Code Council Review\n\n${review}\n\n---\n*Review generated by [Code Council](https://github.com/klitchevo/code-council) - Multi-model AI code review*`;

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body
              });
              console.log(`Updated existing comment: ${existingComment.html_url}`);
            } else {
              // Create new comment
              const { data: newComment } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
              console.log(`Created new comment: ${newComment.html_url}`);
            }
